<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rentopia | Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #F8F5FC;
            color: #555555;
        }

        /* Header */
        header {
            background: linear-gradient(to right, #6A11CB, #F5C542);
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }

        /* Navbar */
        .navbar {
            background-color: #4B2C82 !important;
            border-bottom: 3px solid #F5C542;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .btn-outline-light:hover {
            background-color: #F5C542;
            color: #4B2C82;
            border-color: #F5C542;
        }

        /* Booking Card */
        .booking-card {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(75, 44, 130, 0.25);
        }

        /* Price Box */
        .price-box {
            background: #F5C542;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #4B2C82;
            font-weight: bold;
        }

        /* Buttons */
        .btn-success {
            background-color: #4B2C82;
            border: none;
            font-weight: bold;
        }

        .btn-success:hover {
            background-color: #F5C542;
            color: #4B2C82;
        }

        /* Footer */
        footer {
            background-color: #4B2C82;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>Book Your Item</h1>
</header>

<!-- Navbar -->
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand text-white" href="home.html">Rentopia</a>
        <a href="userd.html" class="btn btn-outline-light btn-sm">Dashboard</a>
    </div>
</nav>

<!-- Booking Card -->
<div class="booking-card">

    <h3 class="mb-3 text-center" style="color:#4B2C82;">Booking Details</h3>

    <!-- Item Details -->
    <div class="mb-3">
        <h5>Item Name: <span style="color:#6A11CB;">Bridal Lehenga</span></h5>
        <p>Category: Bridal Wear</p>
        <p>Rental Price: ₹1000 / day</p>
    </div>

    <hr>

    <!-- Booking Form -->
    <form onsubmit="return confirmBooking()">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Start Date</label>
                <input type="date" id="startDate" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">End Date</label>
                <input type="date" id="endDate" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Delivery Option</label>
            <select id="delivery" class="form-select">
                <option value="">Select option</option>
                <option value="pickup">Self Pickup</option>
                <option value="delivery">Home Delivery</option>
            </select>
        </div>

        <div class="price-box mb-3">
            <h5>Total Amount</h5>
            <h3 id="totalPrice">₹0</h3>
        </div>

        <button type="submit" class="btn btn-success w-100">
            Confirm Booking
        </button>

    </form>
</div>

<footer>
    <p>&copy; 2025 Rentopia. All Rights Reserved.</p>
</footer>

<!-- JavaScript -->
<script>
function confirmBooking() {

    let start = document.getElementById("startDate").value;
    let end = document.getElementById("endDate").value;
    let delivery = document.getElementById("delivery").value;

    if (start === "" || end === "" || delivery === "") {
        alert("Please fill all booking details!");
        return false;
    }

    let startDate = new Date(start);
    let endDate = new Date(end);

    if (endDate < startDate) {
        alert("End date must be after start date!");
        return false;
    }

    let days = Math.ceil((endDate - startDate) / (1000 * 3600 * 24)) + 1;
    let pricePerDay = 1000;
    let total = days * pricePerDay;

    document.getElementById("totalPrice").innerText = "₹" + total;

    window.location.href = "payment.html?amount=" + total;

    return false;
}
</script>

</body>
</html>
