<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rentopia | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #F8F5FC;
    color: #555555;
}

.navbar {
    background-color: #4B2C82;
}

.navbar-brand,
.nav-link {
    color: #ffffff !important;
    font-weight: 500;
}

.nav-link:hover {
    color: #F5C542 !important;
    text-decoration: underline;
}

.login-section {
    background: linear-gradient(to right, #6A11CB, #F5C542);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-card {
    max-width: 420px;
    width: 100%;
    padding: 35px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(75, 44, 130, 0.25);
}

.login-card h3 {
    text-align: center;
    margin-bottom: 20px;
    color: #4B2C82;
    font-weight: bold;
}

.btn-login {
    background-color: #4B2C82;
    border: none;
    color: white;
    font-weight: bold;
}

.btn-login:hover {
    background-color: #F5C542;
    color: #2D1B4E;
}

footer {
    background-color: #4B2C82;
    color: #ffffff;
    padding: 15px;
    text-align: center;
}

.logo{
    height:45px;          /* controls navbar height */
    width:auto;
    margin-right:12px;
    transform: scale(1.7);   /* increases visual size */
    transform-origin: left center;
}


.brand-text{
    font-size:22px;
    font-weight:bold;
    color:white;
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
<div class="container">

<a class="navbar-brand d-flex align-items-center" href="home.html">
<img src="photos/rentopia_logo.png" class="logo">
<span class="brand-text">Rentopia</span>
</a>

<div class="ms-auto">
<a class="nav-link d-inline mx-3" href="home.html">Home</a>
<a class="nav-link d-inline mx-3" href="category.html">Categories</a>
<a class="nav-link d-inline mx-3" href="ur.html">Register</a>
<a class="nav-link d-inline mx-3" href="contact.html">Contact</a>
<a class="nav-link d-inline mx-3" href="About.html">About Us</a>
</div>

</div>
</nav>

<section class="login-section">
<div class="login-card">

    <h3>Login to Rentopia</h3>

    <form id="loginForm">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Login As</label>
            <select id="role" class="form-select" required>
                <option value="">Select role</option>
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="d-grid">
            <!-- ✅ FIXED BUTTON -->
            <button type="submit" class="btn btn-login">Login</button>
        </div>

        <p class="text-center mt-3">
            Don’t have an account?
            <a href="ur.html" style="color:#4B2C82; font-weight:500;">Register</a>
        </p>

    </form>

</div>
</section>

<footer>
    © 2025 Rentopia | All-in-One Rental Marketplace
</footer>

<!-- ✅ CLEAN LOGIN SCRIPT -->
<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    try {
        const response = await fetch("http://localhost:5000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password, role })
        });

        const data = await response.json();

        if (data.message === "Login successful") {

            // ✅ STORE USER EMAIL IN LOCAL STORAGE
           localStorage.setItem("loggedInUser", data.user.email);
	  localStorage.setItem("userId", data.user.id); 
         localStorage.setItem("userRole", data.user.role);

            alert("Login successful!");

            // ✅ ROLE-BASED REDIRECT
            if (role === "vendor") {
                window.location.href = "vendord.html";
            } else if (role === "admin") {
                window.location.href = "admin.html";
            } else {
                window.location.href = "home.html";
            }

        } else {
            alert("Invalid credentials!");
        }

    } catch (error) {
        alert("Error connecting to server");
    }
});
</script>

</body>
</html>
