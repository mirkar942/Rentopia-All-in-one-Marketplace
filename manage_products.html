<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rentopia | Manage Products</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://unpkg.com/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #F8F5FC;
    font-family: Arial, sans-serif;
}

.navbar {
    background-color: #4B2C82;
}

.navbar-brand {
    color: white !important;
    font-weight: bold;
}

.table th {
    background-color: #4B2C82;
    color: white;
}

.product-img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
}

.btn-dark {
    background-color: #4B2C82;
    border: none;
}

.btn-dark:hover {
    background-color: #F5C542;
    color: #4B2C82;
}

.nav-container{
    width:90%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
 .logo-area{
    display:flex;
    align-items:center;
}

.logo{
    height:45px;
    margin-right:10px;
}

.brand-text{
    font-size:22px;
    font-weight:bold;
    color:white;
}

.nav-links a{
    margin:0 10px;
    text-decoration:none;
    color:white;
    font-weight:500;
}

.nav-links a:hover{
    color:#F5C542;
}
</style>
</head>

<body>
   
<nav class="navbar">
  <div class="nav-container">

    <div class="logo-area">
      <img src="photos/rentopia_logo.png" class="logo">
      <span class="brand-text">Rentopia</span>
    </div>

    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="category.html">Categories</a>
      <a href="cart.html">🛒 Cart <span id="cartCount">0</span></a>
      <a href="login.html">Login</a>
      <a href="contact.html">Contact</a>
      <a href="About.html">About Us</a>
      <a href="admin.html">Admin Dashboard</a>
    </div>

  </div>
</nav>

<!-- Products Table -->
<div class="container my-5">
<h2 class="text-center mb-4" style="color:#4B2C82;">Manage Products</h2>

<table class="table table-bordered table-hover text-center align-middle">
<thead>
<tr>
<th>ID</th>
<th>Image</th>
<th>Product Name</th>
<th>Category</th>
<th>Vendor</th>
<th>Price/Day</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="productsTableBody">
</tbody>
</table>

</div>

<script>

// 🔒 Admin protection
const adminRole = localStorage.getItem("userRole");
if (adminRole !== "admin") {
    window.location.href = "login.html";
}

// Load Products
function loadProducts() {
    fetch("http://localhost:5000/api/products")
    .then(res => res.json())
    .then(products => {
        const tableBody = document.getElementById("productsTableBody");
        tableBody.innerHTML = "";

        products.forEach(product => {

            const statusBadge = product.status === "Available"
                ? `<span class="badge bg-success">Available</span>`
                : `<span class="badge bg-danger">Out of Stock</span>`;

            const row = `
                <tr>
                    <td>${product.id}</td>
                    <td>
                        <img src="${product.image || 'https://via.placeholder.com/60'}"
                             class="product-img">
                    </td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${product.vendor_name || 'Unknown'}</td>
                    <td>₹${product.price}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn btn-danger btn-sm"
                            onclick="deleteProduct(${product.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;

            tableBody.innerHTML += row;
        });
    })
    .catch(err => console.error("Product load error:", err));
}

// Delete Product
function deleteProduct(id) {

    if (!confirm("Are you sure you want to delete this product?")) return;

    fetch(`http://localhost:5000/api/products/${id}`, {
        method: "DELETE"
    })
    .then(res => res.json())
    .then(() => {
        loadProducts(); // reload after delete
    })
    .catch(err => console.error("Delete error:", err));
}

// Load on page open
loadProducts();

</script>

</body>
</html>
