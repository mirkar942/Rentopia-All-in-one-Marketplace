<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rentopia | Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #F8F5FC;
    font-family: Arial, sans-serif;
}

/* Navbar */
.navbar {
    background-color: #4B2C82;
}

.navbar-brand {
    color: white !important;
    font-weight: bold;
}

.nav-link {
    color: white !important;
}

.nav-link:hover {
    color: #F5C542 !important;
}

/* Dashboard Cards */
.dashboard-card {
    border-radius: 15px;
    padding: 25px;
    color: white;
    text-align: center;
    box-shadow: 0 6px 20px rgba(75, 44, 130, 0.25);
}

.card-users { background-color: #6A11CB; }
.card-vendors { background-color: #F5C542; color: #4B2C82; }
.card-orders { background-color: #4B2C82; }
.card-revenue { background-color: #C9A227; color: #4B2C82; }

.dashboard-card h3 {
    font-size: 32px;
    font-weight: bold;
}

/* Buttons */
.btn-dark {
    background-color: #4B2C82;
    border: none;
}

.btn-dark:hover {
    background-color: #F5C542;
    color: #4B2C82;
}

footer {
    background-color: #4B2C82;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 50px;
}
.nav-container{
    width:90%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
 .logo-area{
    display:flex;
    align-items:center;
}

.logo{
    height:45px;
    margin-right:10px;
}

.brand-text{
    font-size:22px;
    font-weight:bold;
    color:white;
}

.nav-links a{
    margin:0 10px;
    text-decoration:none;
    color:white;
    font-weight:500;
}

.nav-links a:hover{
    color:#F5C542;
}
</style>
</head>

<body>

   
<nav class="navbar">
  <div class="nav-container">

    <div class="logo-area">
      <img src="photos/rentopia_logo.png" class="logo">
      <span class="brand-text">Rentopia</span>
    </div>

    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="category.html">Categories</a>
      <a href="cart.html">🛒 Cart <span id="cartCount">0</span></a>
      <a href="login.html">Login</a>
      <a href="contact.html">Contact</a>
      <a href="About.html">About Us</a>
      <a href="admin.html">Admin Dashboard</a>
    </div>

  </div>
</nav>

<!-- Dashboard Content -->

<!-- Management Section -->
<div class="text-center mt-5">
<a href="manage_users.html" class="btn btn-dark me-3">Manage Users</a>
<a href="vendor.html" class="btn btn-dark me-3">Manage Vendors</a>
<a href="manage_products.html" class="btn btn-dark">Manage Products</a>

<div class="container mt-5">
    <div class="row g-4">

        <div class="col-md-3">
            <div class="dashboard-card card-users">
                <h5>Total Users</h5>
                <h3 id="totalUsers">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="dashboard-card card-vendors">
                <h5>Total Vendors</h5>
                <h3 id="totalVendors">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="dashboard-card card-orders">
                <h5>Total Orders</h5>
                <h3 id="totalOrders">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="dashboard-card card-revenue">
                <h5>Total Revenue</h5>
                <h3 id="totalRevenue">₹ 0</h3>
            </div>
        </div>

    </div>
</div>
</div>

<script>
const user = localStorage.getItem("loggedInUser");
const role = localStorage.getItem("userRole");

if (!user || role !== "admin") {
    alert("Access Denied! Admin Only.");
    window.location.href = "admin.html";
}


function loadDashboard() {
    fetch("http://localhost:5000/api/admin/dashboard")
    .then(res => res.json())
    .then(data => {

        document.getElementById("totalUsers").innerText = data.totalUsers || 0;
        document.getElementById("totalVendors").innerText = data.totalVendors || 0;
        document.getElementById("totalOrders").innerText = data.totalOrders || 0;
       document.getElementById("totalRevenue").innerText =
    "₹ " + Number(data.totalRevenue || 0).toLocaleString("en-IN");

    })
    .catch(err => console.error("Admin dashboard error:", err));
}


document.querySelectorAll(".dashboard-card h3").forEach(el => {
    el.style.transform = "scale(1.1)";
    setTimeout(() => {
        el.style.transform = "scale(1)";
    }, 200);
});
// Load immediately
loadDashboard();

// Auto refresh every 10 seconds
const TEN_MINUTES = 10 * 60 * 1000;
setInterval(loadDashboard, TEN_MINUTES);

</script>

<footer>
<p>&copy; 2025 Rentopia Admin Panel</p>
</footer>

</body>
</html>
