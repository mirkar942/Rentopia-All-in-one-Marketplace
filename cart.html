<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rentopia | Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #F8F5FC;
    color: #555555;
}

.navbar {
    background-color: #4B2C82;
}

.navbar-brand, .nav-link {
    color: #ffffff !important;
    font-weight: 500;
}

.nav-link:hover {
    color: #F5C542 !important;
}

.cart-card {
    border-radius: 15px;
    box-shadow: 0 4px 12px rgba(75, 44, 130, 0.15);
}

.cart-img {
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
}

.btn-dark {
    background-color: #4B2C82;
    border: none;
}

.btn-dark:hover {
    background-color: #F5C542;
    color: #2D1B4E;
}

.qty-box {
    display: flex;
    gap: 5px;
}

footer {
    background-color: #4B2C82;
    color: #ffffff;
    padding: 20px;
    text-align: center;
    margin-top: 40px;
}


.nav-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:1200px;
    margin:auto;
}

.logo-area{
    display:flex;
    align-items:center;
}

.logo{
    height:45px;
    margin-right:10px;
}

.brand-text{
    font-size:22px;
    font-weight:bold;
    color:white;
}

.nav-links a{
    margin:0 10px;
    text-decoration:none;
    color:white;
    font-weight:500;
}

.nav-links a:hover{
    color:#F5C542;
}
</style>
</head>

<body>

<!-- Navbar -->
    
 
   
<nav class="navbar">
  <div class="nav-container">

    <div class="logo-area">
      <img src="photos/rentopia_logo.png" class="logo">
      <span class="brand-text">Rentopia</span>
    </div>

    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="category.html">Categories</a>
      <a href="cart.html">🛒 Cart <span class="cart-count" id="cartCount">0</span></a>
      <a href="login.html">Login</a>
      <a href="contact.html">Contact</a>
      <a href="About.html">About Us</a>
      <a href="userd.html">User Dashboard</a>
    </div>

  </div>
</nav>

<!-- Cart Section -->
<div class="container my-5">
<h2 class="text-center mb-4">🛒 Your Rental Cart</h2>

<div id="cartItems"></div>

<!-- Summary -->
<div class="card p-4 mt-4">

<h6>Subtotal: ₹ <span id="subtotal">0</span></h6>
<h6>GST (18%): ₹ <span id="gst">0</span></h6>
<h6>Delivery: ₹ <span id="delivery">0</span></h6>

<hr>

<h4>Total Amount: ₹ <span id="totalAmount">0</span></h4>

<input type="text" id="couponInput"
class="form-control mt-3"
placeholder="Enter Coupon Code (RENT10)">

<button class="btn btn-warning mt-2 w-100"
onclick="applyCoupon()">Apply Coupon</button>

<button class="btn btn-dark mt-3 w-100"
onclick="goToCheckout()">Proceed to Checkout</button>

</div>
</div>

<footer>
<p>© 2025 Rentopia | All-in-One Rental Marketplace</p>
</footer>

<script>

function getCurrentUser() {
    return localStorage.getItem("loggedInUser");
}

const currentUser = getCurrentUser();

if (!currentUser) {
    alert("Please login first!");
    window.location.href = "login.html";
}

const cartKey = "rentopiaCart_" + currentUser;
let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
let gstRate = 0.18;
let deliveryCharge = 200;

function loadCart() {

    let cartContainer = document.getElementById("cartItems");
    cartContainer.innerHTML = "";

    let subtotal = 0;

    if (cart.length === 0) {
        cartContainer.innerHTML = "<p class='text-center'>Your cart is empty.</p>";
        updateSummary(0);
        updateCartCount();
        return;
    }

    cart.forEach((item, index) => {

        let itemTotal = item.price * item.duration * item.quantity;
        subtotal += itemTotal;

        cartContainer.innerHTML += `
        <div class="card cart-card p-3 mb-3">
        <div class="row align-items-center">

        <div class="col-md-3">
        <img src="${item.image}" class="img-fluid cart-img">
        </div>

        <div class="col-md-3">
        <h5>${item.name}</h5>
        <p class="text-muted">₹${item.price} / ${item.type}</p>
        </div>

        <div class="col-md-3">
        <label>${item.type === "hour" ? "Hours" : "Days"}:</label>
        <div class="qty-box">
            <button class="btn btn-outline-secondary btn-sm"
            onclick="changeDuration(${index}, -1)">-</button>

            <input type="number" class="form-control text-center"
            value="${item.duration}" min="1"
            onchange="updateItem(${index}, this.value)">

            <button class="btn btn-outline-secondary btn-sm"
            onclick="changeDuration(${index}, 1)">+</button>
        </div>
        </div>

        <div class="col-md-2 text-end">
        <button class="btn btn-danger btn-sm"
        onclick="removeItem(${index})">Remove</button>
        </div>

        </div>
        </div>
        `;
    });

    updateSummary(subtotal);
    updateCartCount();
}

function updateSummary(subtotal) {

    let gst = subtotal * gstRate;
    let delivery = subtotal > 0 ? deliveryCharge : 0;
    let total = subtotal + gst + delivery;

    document.getElementById("subtotal").innerText = subtotal.toFixed(2);
    document.getElementById("gst").innerText = gst.toFixed(2);
    document.getElementById("delivery").innerText = delivery;
    document.getElementById("totalAmount").innerText = total.toFixed(2);
}

function updateItem(index, newDuration) {
    cart[index].duration = parseInt(newDuration);
    saveCart();
}

function changeDuration(index, change) {
    cart[index].duration += change;
    if (cart[index].duration < 1) cart[index].duration = 1;
    saveCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    saveCart();
}

function saveCart() {
  localStorage.setItem(cartKey, JSON.stringify(cart));
    loadCart();
}

function updateCartCount() {
    document.getElementById("cartCount").innerText = cart.length;
}

function applyCoupon() {
    let code = document.getElementById("couponInput").value;
    let subtotal = parseFloat(document.getElementById("subtotal").innerText);

    if (code === "RENT10") {
        let discount = subtotal * 0.10;
        subtotal -= discount;
        alert("Coupon Applied! 10% Discount");
        updateSummary(subtotal);
    } else {
        alert("Invalid Coupon Code");
    }
}

function goToCheckout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
    } else {
        window.location.href = "payment.html";
    }
}

loadCart();

</script>
</body>
</html>
